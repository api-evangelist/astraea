name: Astraea
description: >-
  Astraea is a Y Combinator-backed (Spring 2026) clinical trial automation
  platform that gives pharmaceutical sponsors, biotechs, and CROs an AI
  operating system for clinical development. Founded by Joshua Wang and Sanmay
  Sarada, the platform orchestrates specialized AI agents across the full
  biometrics lifecycle - standards mapping, data normalization, CDISC mapping,
  SDTM and ADaM dataset generation, TFLs/TLFs, SAP, eCRFs, Define-XML, QC, and
  submission documents - turning a protocol and raw study data into
  FDA-submission-ready output. Astraea is positioned as sponsor-run software
  rather than a CRO: it runs inside the customer's own secure environment so
  clinical data never reaches Astraea's servers, with 21 CFR Part 11 compliance
  and audit-ready, standards-native traceability. The company reports serving
  10+ global pharma and biotech sponsors with 30-50% faster reporting cycles.
